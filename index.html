<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoultryCare Farmer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff5a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoultryCare">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#ff5a5f;--pd:#e8334a;--tx:#1f2430;--mu:#6b7280;--bg:#f6f7f9;--cd:#fff;--bd:#e8eaee;--sf:#f5f7f8;--rd:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#f6f7f9}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mode-web .mob,.mode-mobile .web{display:none!important}
/* WEB */
.web{min-height:100%;display:flex;flex-direction:column}
.wh{height:57px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.wh b{font-size:18px;font-weight:700}
.wr{display:flex;align-items:center;gap:18px}
.ib{border:1.5px solid var(--p);color:var(--p);border-radius:8px;padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.ib:hover{background:#fff1f1}
.wr .sep{width:1px;height:22px;background:var(--bd)}
.lk{font-weight:500}.lk.r{color:var(--p);font-weight:600}
.wb{display:flex;gap:24px;padding:23px;flex:1;align-items:flex-start}
aside{width:240px;flex:none}
.card{background:var(--cd);border-radius:12px;box-shadow:0 1px 4px rgba(20,24,40,.07)}
.prof{padding:20px;display:flex;flex-wrap:wrap;gap:0 12px;margin-bottom:16px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#f04a4a);color:#fff;display:grid;place-items:center;font-weight:600}
.prof .n{font-weight:600;font-size:15px}.prof .e{font-size:12px;color:var(--mu)}
.badge{display:inline-block;background:#eceef1;font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 9px;border-radius:10px;margin-top:6px}
.so{color:var(--p);font-size:13px;margin-top:10px;width:100%}
.nav{padding:0;overflow:hidden}
.nav button{display:block;width:100%;text-align:left;padding:14px 0 14px 50px;font-weight:600;font-size:15px;color:#2c3340;border-left:3px solid transparent}
.nav button.on{color:var(--p);background:#f5f6f8;border-left-color:var(--p)}
.nav button:hover{background:#f5f6f8}
.wm{flex:1;min-width:0}
.hero{padding:62px 30px;margin-bottom:26px}.hero h2{font-size:22px;font-weight:600}.hero p{color:#444;margin-top:6px;font-size:15px}
.sec{font-size:15px;font-weight:700;color:#7b8494;margin-bottom:10px;letter-spacing:.3px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kc{padding:20px;border-top:3px solid #ff6a70;text-align:left;cursor:pointer;transition:transform .15s}
.kc:hover{transform:translateY(-2px)}.kc.o{border-top-color:#e11d3f}
.kc small{display:block;font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.kc strong{display:block;font-size:24px;margin-top:10px;font-weight:700;color:#000}.kc em{font-style:normal;font-size:12px;color:var(--mu)}
.need{padding:26px 30px}.need h3{font-size:17px;margin-bottom:10px}.need p{font-size:15px;color:#444}.need a{color:#0b6cff}
.col{max-width:620px}
.wide{max-width:780px}
/* shared content */
.bh{text-align:center;padding:14px 16px 0}
.bh .t{color:var(--mu);font-weight:500;font-size:13px}
.dn{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.dn button{width:40px;height:40px;border-radius:50%;background:#eceef1;font-weight:700;font-size:16px}
.dn h2{font-family:'Archivo Black',Inter,sans-serif;font-weight:800;font-size:20px;letter-spacing:.2px}.dn small{color:var(--mu);font-weight:500}
.st{display:flex;margin-top:14px;padding:12px 0;border-bottom:1px solid var(--bd)}
.st div{flex:1;text-align:center;border-left:1px solid var(--bd);font-size:12px;color:#444;font-weight:500}
.st div:first-child{border:0;text-align:left;padding-left:16px}.st div:last-child{text-align:right;padding-right:16px}
.st b{display:block;font-size:16px;font-weight:700;color:#000;margin:2px 0}.st i{font-style:normal;font-size:11px;color:var(--mu)}
.tabs{display:flex;border-bottom:1px solid var(--bd);background:#fff}
.tabs button{flex:1;padding:14px 0;font-weight:600;color:#4b5563;border-bottom:2px solid transparent}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.fg{padding:16px;border-bottom:1px solid var(--bd);background:#fff}
.fg small{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:#6b7280;text-transform:uppercase}
.fg h4{font-size:14px;font-weight:700;margin:4px 0 10px}.fg small{margin-bottom:10px}

@keyframes inr{from{transform:translateX(48px);opacity:.2}to{transform:none;opacity:1}}@keyframes inl{from{transform:translateX(-48px);opacity:.2}to{transform:none;opacity:1}}.inr{animation:inr .28s ease}.inl{animation:inl .28s ease}
.kp.m{grid-template-columns:1fr 1fr;gap:10px}.kp.m .kc{padding:14px}.kp.m .kc strong{font-size:17px;margin-top:8px}
.paper{background:#fff;border:1px solid #ddd;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:16px;font-size:12px;line-height:1.5;overflow-x:auto}.paper .card{box-shadow:none;padding:0}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}}
.fi{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:0 14px;height:56px;background:#fff}
.fi input{flex:1;min-width:0;border:0;outline:0;font:700 20px Inter,sans-serif;color:#000;background:none}
.fi input::placeholder{color:#9ca3af}.fi span{font-weight:700;color:#6b7280}
.fi:focus-within{border-color:var(--p)}
.sv{padding:16px;background:var(--bg)}
.sv button{width:100%;height:46px;border-radius:8px;background:var(--p);color:#fff;font-weight:800;letter-spacing:1px;box-shadow:0 3px 8px rgba(255,90,95,.35)}
.sv button:active{transform:scale(.98)}
.ec{margin:14px;border-radius:12px;background:#fff;box-shadow:0 1px 6px rgba(20,24,40,.1);overflow:hidden}
.ech{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.ech svg{color:var(--p);width:22px;height:22px}.ech b{font-size:16px}.ech small{display:block;color:var(--mu);font-weight:500}.ech .cv{margin-left:auto;color:#555}
.ecb{padding:18px 14px}
.ecb h3{text-align:center;color:#374151;font-size:15px;margin-bottom:14px}
.fcr{background:linear-gradient(#fff,#fff0f0);border:1px solid #ffd4d4;border-radius:14px;padding:16px;text-align:center}
.fcr small{color:var(--p);font-weight:700;letter-spacing:1px;font-size:11px}.fcr strong{display:block;font-size:44px;color:var(--p);font-weight:800;margin:4px 0 10px}
.fcr div{background:#fff;border:1px dashed #e5c4c4;border-radius:8px;padding:10px;font-size:12px;color:#444}.fcr div b{display:block;font-size:13px;color:#000}
.tr{margin-top:18px;font-weight:600;font-size:12.5px;color:#374151}
.bar{height:20px;border:1px solid var(--bd);background:#f7f8fa;margin:6px 0 4px;border-radius:2px}
.bar i{display:block;height:100%;background:var(--p);color:#fff;font:700 11px/20px Inter;text-align:right;padding-right:10px;font-style:normal}
.sc{display:flex;justify-content:space-between;font-size:11px;color:#555}
.vb{display:block;width:100%;height:44px;border-radius:8px;background:var(--p);color:#fff;font-weight:800;letter-spacing:1px;margin:22px 0 12px;box-shadow:0 3px 8px rgba(255,90,95,.35)}
.dots{display:flex;gap:6px;justify-content:center}.dots button{width:8px;height:8px;border-radius:50%;background:#cfd3da}.dots .on{background:var(--p)}
.ch{border:1px solid var(--bd);border-radius:4px;margin-top:6px;overflow:hidden}
.tt{background:#f1f2f4;border-radius:8px;padding:12px;margin-top:14px;font-size:12px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px 4px;text-align:right;align-items:center}
.tt .h{color:#6b7280;font-weight:600}.tt .l{text-align:left;font-weight:700;display:flex;gap:6px;align-items:center}.tt b{font-weight:700}
/* pages */
.pc{padding:14px;display:flex;flex-direction:column;gap:12px}
.wide .pc,.col .pc{padding:0}
.hd{padding:16px}.hd .row{display:flex;justify-content:space-between;align-items:baseline}.hd h3{font-size:16px}.hd .row span{font-size:12px;color:var(--mu)}.hd p{font-size:12px;color:var(--mu);margin-top:10px;line-height:1.5}
.gc{padding:16px;cursor:pointer}.gc .a{display:flex;justify-content:space-between;align-items:center}.gc .a b{font-size:14px}
.pill{background:#fff0d6;color:#d97706;font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px}
.gc .m{display:flex;gap:6px;align-items:center;color:#5b6475;font-size:12px;margin:8px 0 10px;padding-bottom:10px;border-bottom:1px dashed #d7dbe2}
.gc .m svg{width:14px;height:14px;color:#4f6bd8}
.gc .v{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:#6b7280;letter-spacing:.3px}.gc .v+.v{margin-top:2px}
.gc .v2{display:flex;justify-content:space-between;font-size:18px;font-weight:800}.gc .v2 .d{color:var(--rd)}
.gcs{display:grid;gap:12px}
.rec{padding:16px}
.rec .t{text-align:center;margin-bottom:12px}.rec .t h3{font-size:16px;letter-spacing:.3px}.rec .t p{font-size:11px;line-height:1.5;margin:2px 0}.rec .t b{font-size:12px;display:block;border:1px solid var(--bd);border-left:0;border-right:0;padding:2px;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;font-size:12.5px;gap:12px 8px;margin:16px 4px}
.kv span:nth-child(odd){color:#374151}
.rec h4{font-size:15px;text-decoration:underline;letter-spacing:.3px;margin:20px 4px 8px}
.pt{width:100%;border-collapse:collapse;font-size:12.5px}.pt td{border:1px solid var(--bd);padding:8px 10px;width:50%}.pt tr.f{background:#ffe6e6;color:#e5484d}.rd{color:var(--p)}.bl{color:#1d4ed8}
.pf{padding:16px}.pf .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pf .t b{font-size:15px}
.tag{background:var(--p);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.in{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 14px}
.in div{display:flex;justify-content:space-between;padding:11px 0;font-size:12.5px;border-bottom:1px solid var(--bd)}.in div:last-child{border:0}
.in span{color:#6b7280;font-weight:500}.in b{font-weight:700}
.so2{width:100%;margin-top:10px;background:#ffe1e1;border:1px solid #f5bcbc;color:#8b1a1a;font-weight:700;border-radius:8px;height:44px}
.sm{font-size:11px;color:#6b7280;margin-bottom:12px}
.fl{display:flex;gap:10px;align-items:flex-end;margin-top:10px}.fl label{font-size:11px;font-weight:600;color:#555;flex:1}
.fl input{width:100%;margin-top:4px;border:1px solid #cdd2da;border-radius:6px;padding:8px;font:12px Inter}
.fl button{background:var(--p);color:#fff;font-weight:700;border-radius:8px;height:36px;padding:0 18px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.bs div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.bs small{font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.5px}.bs b{display:block;font-size:16px;margin-top:6px}
.dl{color:var(--p);font-size:12px;font-weight:700}
.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd);font-size:12px}.tx:last-child{border:0}.tx small{display:block;color:#6b7280;margin-top:4px}.tx .r{text-align:right}.tx .r b{display:block;font-size:14px}
.neg{color:var(--rd)}.pos{color:var(--p)}
/* MOBILE */
.mob{position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.mode-mobile .mob{height:100vh;height:100dvh}
.mode-mobile.framed .mob{width:390px;height:min(844px,calc(100vh - 48px));margin:24px auto;border-radius:30px;box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 8px #1b1f27}
.mode-mobile.framed body,.framed{background:#d9dce2}
.mh{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.mh h1{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.mh.c h1{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.mh button{position:relative;z-index:1;padding:4px;color:#222}
.msc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}.msc::-webkit-scrollbar{display:none}
.wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:90px}
.wel .tp{position:absolute;top:2px;left:4px;font-size:15px}
.wel .ic{width:100px;height:100px;border-radius:50%;background:#eceef1;display:grid;place-items:center;margin-bottom:22px}.wel .ic svg{width:34px;height:34px}
.wel small{font-weight:700;letter-spacing:.5px;font-size:14px}.wel h1{font-size:30px;font-weight:800;margin:10px 0 36px;padding:0 10px}
.wel h3{font-size:19px}.wel h4{font-size:16px;margin:8px 0}.wel p{font-weight:600}
.wel .co{color:#6b2c9e;margin:36px 0 12px;font-size:16px;display:flex;gap:8px;align-items:center}
.wel .ib{padding:12px 24px;font-size:17px;font-weight:500}
.ov{position:absolute;inset:0;background:rgba(15,20,30,.35);z-index:20;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:absolute;top:0;bottom:0;left:0;width:250px;background:#fff;z-index:21;transform:translateX(-100%);transition:.25s}
.dr.on{transform:none}
.dr .h{padding:22px 18px 12px;border-bottom:1px solid #eee}.dr .h b{font-size:16px}.dr .h small{display:block;color:#64748b;font-size:11.5px;margin-top:4px}
.dr nav{padding:10px 9px}.dr nav button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 10px;border-radius:8px;font-weight:600;font-size:13px;margin-bottom:2px}
.dr nav button.on{background:#fff0f0;color:var(--p)}
/* modal & toast */
.md{position:fixed;inset:0;background:rgba(40,46,58,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.md.on{display:flex}
.mb{background:#fff;border-radius:18px;width:100%;max-width:530px;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:96vh;overflow:auto}
.mb .x{position:absolute;right:20px;top:20px;color:#444}
.mt{display:flex;gap:16px;align-items:center;padding-right:30px}.mt .i{width:62px;height:62px;border-radius:14px;background:#ffdfe2;color:var(--pd);display:grid;place-items:center;flex:none}.mt .i svg{width:30px;height:30px}
.mt b{font-size:17px}.mt p{color:#5b6475;font-size:14px;margin-top:4px;line-height:1.4}
.go{width:100%;height:52px;margin:20px 0 14px;border-radius:10px;background:linear-gradient(#f7475c,#ea3350);color:#fff;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center;justify-content:center}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.pl button{padding:12px 4px;border:1px solid #d9dde4;font-weight:600;color:#4b5563;display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px}
.pl button:first-child{border-radius:10px 0 0 10px}.pl button:last-child{border-radius:0 10px 10px 0}.pl .on{border-color:#f5a3ad;color:#d92a45;background:#fff1f2}
.stp{border:1px solid var(--bd);border-radius:12px;background:#fafbfc;padding:12px 16px;margin-top:14px}
.stp div{display:flex;gap:14px;align-items:flex-start;padding:9px 0;font-size:14px;line-height:1.45}.stp i{width:24px;height:24px;border:1.5px solid #f0707f;color:#d92a45;border-radius:50%;display:grid;place-items:center;font:600 12px Inter;flex:none;margin-top:1px}
.ft{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:16px;padding-top:16px;color:#4b5563;font-weight:600;font-size:13px}.ft span{display:flex;gap:8px;align-items:center}.ft svg{color:var(--pd)}
.tst{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);background:#1f2430;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}.tst.on{opacity:1;transform:translate(-50%,0)}
.vs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1f2430;border-radius:22px;padding:4px;display:flex;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vs button{color:#cbd0da;padding:7px 18px;border-radius:18px;font-weight:600;font-size:12px}.vs .on{background:#fff;color:#1f2430}
@media(max-width:1000px){.kp{grid-template-columns:repeat(2,1fr)}}
.pl2 .ib{border:0;padding:0;color:var(--p);font-weight:500;font-size:15px}.pl2 .ib:hover{background:none}.pl2 .sep{display:none}.pl2 .wr{gap:12px}.pl2 .lk{font-size:15px}
.wph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px}.wph h1{font-size:24px;font-weight:600;line-height:1.2}.wph .sub{color:#555;font-size:14px;margin-top:4px}
.wc{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(20,24,40,.07);padding:24px;margin-bottom:24px}.wc h3{font-size:18px;font-weight:600;margin-bottom:20px}
.wl{display:block;font-size:14px;margin-bottom:6px;color:#333}.wi{height:38px;border:1px solid #ced4da;border-radius:4px;padding:0 10px;font:14px Inter,sans-serif;background:#fff;color:#212529;width:100%}.wi:focus{outline:0;border-color:var(--p)}.wf{max-width:48%;margin-bottom:18px}
.wbtn{height:38px;padding:0 16px;border-radius:5px;border:1px solid #ced4da;background:#f8f9fa;font-size:14px}.wbtn.p{background:#ff5a5f;border-color:#ff5a5f;color:#fff}.wbtn.b{background:#0d6efd;border-color:#0d6efd;color:#fff}.wbtn.o{background:#fff;border-color:#6c757d;color:#6c757d;height:32px}
.wbw{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}.wbw h3{margin:0!important}.wbw span{font-size:12.5px;color:#444}
.wt2{width:100%;border-collapse:collapse;font-size:14px}.wt2 th,.wt2 td{border:1px solid #dee2e6;padding:8px}.wt2 th{font-weight:600;text-align:left}.wlk{color:#0d6efd;text-decoration:underline;font-size:14px}
.wrp{border-top:3px solid #ff5a5f}.wrt th{background:#dfe5ee;font-size:13px;vertical-align:bottom;line-height:1.3}.wrt tfoot td{background:#dfe5ee;font-weight:700}.wrt td{font-size:13px}.wnote{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:6px;padding:16px;font-size:13px;line-height:1.7;margin-top:16px}
